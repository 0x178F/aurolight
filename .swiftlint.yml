# Layout is swift-format's job, so spacing, brace and comma rules are off.
included:
  - core/Sources
  - core/Tests
  - macos/Sources
  - macos/Tests
excluded:
  - "**/.build"

disabled_rules:
  - trailing_comma
  - opening_brace
  - vertical_whitespace
  - comma
  - closure_parameter_position
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - legacy_multiple
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unused_optional_binding

line_length:
  warning: 120
  ignores_urls: true
function_body_length:
  warning: 80
  error: 150
type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 600
  error: 900
cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true
function_parameter_count:
  warning: 6
  error: 8
nesting:
  type_level: 2
identifier_name:
  min_length: 1
  max_length: 50
large_tuple:
  warning: 4
