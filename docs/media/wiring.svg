<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171b22"/>
      <stop offset="1" stop-color="#101318"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b58cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b58cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="420" rx="20" fill="url(#bg)"/>

  <!-- Wires -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 196 150 L 276 150" stroke="#6aa9ff"/>
    <path d="M 452 115 L 520 115 l 6 -10 l 12 20 l 12 -20 l 12 20 l 12 -20 l 6 10 L 640 115" stroke="#3ccf8e"/>
    <path d="M 452 150 L 640 150" stroke="#9aa3b2"/>
    <path d="M 580 320 L 610 320 L 610 150" stroke="#9aa3b2"/>
    <path d="M 580 360 L 625 360 L 625 185 L 640 185" stroke="#ff5a4f"/>
  </g>
  <circle cx="610" cy="150" r="6" fill="#9aa3b2"/>

  <!-- Mac -->
  <rect x="56" y="102" width="140" height="92" rx="10" fill="#232833" stroke="#3a4250" stroke-width="2"/>
  <rect x="68" y="112" width="116" height="66" rx="4" fill="#0c0f14"/>
  <rect x="40" y="194" width="172" height="10" rx="5" fill="#3a4250"/>
  <text x="126" y="151" text-anchor="middle" font-size="18" font-weight="600" fill="#e8ebf0">Mac</text>
  <text x="236" y="140" text-anchor="middle" font-size="13" fill="#6aa9ff">USB</text>

  <!-- Controller -->
  <rect x="276" y="92" width="176" height="116" rx="12" fill="#1d3b2e" stroke="#2f6b50" stroke-width="2"/>
  <text x="364" y="146" text-anchor="middle" font-size="18" font-weight="600" fill="#e8ebf0">Controller</text>
  <text x="364" y="168" text-anchor="middle" font-size="12" fill="#9fc9b4">Arduino · ESP32 · Pico · …</text>
  <circle cx="452" cy="115" r="6" fill="#3ccf8e"/>
  <circle cx="452" cy="150" r="6" fill="#9aa3b2"/>
  <text x="464" y="106" font-size="12" fill="#3ccf8e">data pin</text>
  <text x="464" y="141" font-size="12" fill="#9aa3b2">GND</text>
  <text x="550" y="96" text-anchor="middle" font-size="13" fill="#3ccf8e">330–470 Ω</text>

  <!-- LED strip -->
  <rect x="640" y="88" width="280" height="120" rx="12" fill="#1f232b" stroke="#3a4250" stroke-width="2"/>
  <ellipse cx="808" cy="160" rx="110" ry="36" fill="url(#glow)"/>
  <text x="808" y="120" text-anchor="middle" font-size="18" font-weight="600" fill="#e8ebf0">LED strip</text>
  <rect x="718" y="142" width="180" height="36" rx="6" fill="#12151b" stroke="#3a4250" stroke-width="1.5"/>
  <rect x="732" y="152" width="16" height="16" rx="3" fill="#29d3ff"/>
  <rect x="766" y="152" width="16" height="16" rx="3" fill="#6f7dff"/>
  <rect x="800" y="152" width="16" height="16" rx="3" fill="#b066ff"/>
  <rect x="834" y="152" width="16" height="16" rx="3" fill="#ff5fa2"/>
  <rect x="868" y="152" width="16" height="16" rx="3" fill="#ffb347"/>
  <circle cx="640" cy="115" r="6" fill="#3ccf8e"/>
  <circle cx="640" cy="150" r="6" fill="#9aa3b2"/>
  <circle cx="640" cy="185" r="6" fill="#ff5a4f"/>
  <text x="654" y="119" font-size="12" fill="#3ccf8e">DIN</text>
  <text x="654" y="154" font-size="12" fill="#9aa3b2">GND</text>
  <text x="654" y="189" font-size="12" fill="#ff8a82">+5V</text>

  <!-- Power supply -->
  <rect x="420" y="296" width="160" height="88" rx="12" fill="#3a2320" stroke="#6b3a33" stroke-width="2"/>
  <text x="480" y="336" text-anchor="middle" font-size="18" font-weight="600" fill="#e8ebf0">5 V supply</text>
  <text x="480" y="358" text-anchor="middle" font-size="12" fill="#d9a8a2">sized for the strip</text>
  <circle cx="580" cy="320" r="6" fill="#9aa3b2"/>
  <circle cx="580" cy="360" r="6" fill="#ff5a4f"/>
  <text x="568" y="324" text-anchor="end" font-size="12" fill="#9aa3b2">GND</text>
  <text x="568" y="364" text-anchor="end" font-size="12" fill="#ff8a82">+5V</text>
  <text x="598" y="250" text-anchor="end" font-size="13" fill="#9aa3b2">common ground</text>
</svg>
