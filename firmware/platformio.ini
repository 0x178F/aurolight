; One environment per board; platforms and FastLED are pinned to tested versions.

[platformio]
src_dir = Aurolight
default_envs = nano

[env]
framework = arduino
lib_deps = fastled/FastLED@3.10.5
monitor_speed = 115200

[env:nano]
; Old bootloader (most CH340 clones); use nano_new for the new one.
platform = atmelavr@5.1.0
board = nanoatmega328

[env:nano_new]
platform = atmelavr@5.1.0
board = nanoatmega328new

[env:uno]
platform = atmelavr@5.1.0
board = uno

[env:mega]
platform = atmelavr@5.1.0
board = megaatmega2560

[env:esp32]
platform = espressif32@7.0.1
board = esp32dev
monitor_speed = 921600

[env:esp32s3]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1

[env:esp32c3]
platform = espressif32@7.0.1
board = esp32-c3-devkitm-1
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1

[env:esp8266]
platform = espressif8266@4.2.1
board = d1_mini
monitor_speed = 921600

[env:pico]
; Community platform (not in the PlatformIO registry), pinned to a commit for reproducible builds.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = pico
board_build.core = earlephilhower

[env:teensy41]
platform = teensy@6.0.0
board = teensy41
